[package]
name = "antinode-probe"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Phase 1 control run: connect to a HyVibe guitar and confirm the recovered protocol against hardware."
publish = false

[[bin]]
name = "antinode-probe"
path = "src/main.rs"

[dependencies]
antinode = { workspace = true }
antinode-ble = { path = "../../crates/antinode-ble" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
