[package]
name = "antinode"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sans-io client protocol for the HyVibe smart guitar: JSON-RPC over BLE, chunked transport, and the effect/parameter model."
keywords = ["guitar", "bluetooth", "ble", "jsonrpc", "audio"]
categories = ["network-programming", "no-std", "multimedia::audio"]

[lib]
path = "src/lib.rs"

[dependencies]
# JSON is the protocol, so a JSON implementation is not an optional dependency.
# Both are pulled without default features so the crate stays no_std; `alloc` is
# required because JSON values are inherently heap-shaped.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
